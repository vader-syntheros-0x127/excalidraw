# STRL-Ideate desktop packaging (electron-builder).
# The renderer (built SPA) is copied to ./renderer by `pnpm build:renderer`
# before packaging and bundled alongside the compiled main process.
appId: com.strl.ideate
productName: STRL-Ideate
copyright: STRL

# asar packs the app (dist/ + renderer/) into a single archive — packaging
# hygiene + fewer files on disk. The app:// handler reads renderer files via
# fs, which is asar-aware, so no asarUnpack is needed.
asar: true

directories:
  output: dist-installers
  buildResources: assets

files:
  - "dist/**/*"
  - "package.json"
  - "renderer/**/*"

# .excalidraw file association (OS-level). On Windows, NSIS registers the
# ProgID/extension; on macOS this becomes a CFBundleDocumentTypes entry; on
# Linux it populates the .desktop MimeType. The OS then launches the app with
# the file path (argv on win/linux, open-file event on mac) — main.ts already
# handles both (takeFileFromArgv + app.on("open-file") + single-instance).
fileAssociations:
  - ext: excalidraw
    name: STRL-Ideate scene
    role: Editor
    mimeType: application/vnd.excalidraw+json

linux:
  target:
    - AppImage
    - deb
  category: Graphics
  maintainer: STRL <revan@secarclabs.com>
  icon: assets/icon.png
  synopsis: Virtual hand-drawn style whiteboard
  description: STRL-Ideate — a local-first whiteboard for sketching diagrams.

# ── Windows (NSIS installer) ────────────────────────────────────────────────
# Cross-builds on Linux via Wine (wine 9.0 is installed on the dev host) — used
# for NSIS packaging + rcedit icon/version stamping; a windows-latest runner
# also works. Only macOS genuinely cannot be cross-built from Linux.
# Signing is HELD: with no CSC_* env set, electron-builder produces a valid
# UNSIGNED installer. Provisioning a cert later is env-only, no YAML change.
win:
  target:
    - target: nsis
      arch:
        - x64
        # - arm64   # enable only when Windows-on-ARM hardware is available to test
    - target: portable
      arch:
        - x64
  icon: assets/icon.png # PNG auto-converted to ICO; add assets/icon.ico later for crisp small badges

nsis:
  oneClick: false # assisted wizard
  perMachine: false # per-user install → no admin/UAC; friendlier unsigned SmartScreen
  allowElevation: true # user may still opt into all-users
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: STRL-Ideate
  runAfterFinish: true
  deleteAppDataOnUninstall: false # keep local scenes/settings (local-first)
  artifactName: ${productName}-${version}-${arch}-setup.${ext}

# Portable build: a single self-contained .exe that needs no installation — it
# unpacks to %TEMP% and launches. Handy for USB sticks / locked-down machines.
portable:
  artifactName: ${productName}-${version}-${arch}-portable.${ext}
  requestExecutionLevel: user # run as the current user, never prompts for admin

# ── macOS (dmg) ─────────────────────────────────────────────────────────────
# Build on macos-latest (hdiutil + dmgbuild are macOS-only). Signing &
# notarization are HELD; an unsigned dmg builds with CSC_IDENTITY_AUTO_DISCOVERY=false.
mac:
  target:
    - target: dmg
      arch:
        - x64
        - arm64
  category: public.app-category.graphics-design
  icon: assets/icon.png # PNG auto-converted to ICNS
  darkModeSupport: true
  minimumSystemVersion: "11.0"
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: assets/entitlements.mac.plist
  entitlementsInherit: assets/entitlements.mac.plist
  notarize: false # HELD — flip to { teamId: ... } + APPLE_* env later

dmg:
  window:
    width: 540
    height: 380
  contents:
    - x: 140
      y: 200
      type: file
    - x: 400
      y: 200
      type: link
      path: /Applications
