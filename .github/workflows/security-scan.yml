# STRL-Ideate supply-chain / security scanning.
#
# Two layers:
#   audit  — pnpm's advisory-DB check. Always runs, needs no secrets.
#   snyk   — Snyk SCA (deps) + Snyk Code (SAST), org `syntheros`. Runs only when
#            the SNYK_TOKEN repo secret is present; posts results to the Snyk
#            dashboard via `snyk monitor`.
#
# Pairs with the pre-install layer (Aikido Safe Chain) used during development —
# see the STRL supply-chain policy. Findings are reported, not gating: the known
# residual highs live in build-tooling, so scans use continue-on-error and a
# high/critical threshold rather than failing the build.
name: Security scan

on:
  workflow_dispatch: {}
  push:
    branches: [master, feat/desktop-app]
  pull_request: {}
  schedule:
    - cron: "0 6 * * 1" # weekly, Monday 06:00 UTC

permissions:
  contents: read

jobs:
  audit:
    name: pnpm audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Enable corepack + pin pnpm 10.34.1
        run: |
          corepack enable
          corepack prepare pnpm@10.34.1 --activate

      - name: Setup Node.js 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22

      # Reads pnpm-lock.yaml against the registry advisory DB (no install needed).
      # Informational: the residual highs are build-tooling (vite-plugin-html,
      # sass) + one transitive (lodash-es via mermaid); cleared on upstream sync.
      - name: pnpm audit (prod, high+)
        continue-on-error: true
        run: pnpm audit --prod --audit-level=high

  snyk:
    name: Snyk (SCA + Code)
    runs-on: ubuntu-latest
    env:
      # Mapped from the secret so it can be referenced in step `if:` conditions.
      SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
    steps:
      - name: Notice (no token)
        if: ${{ env.SNYK_TOKEN == '' }}
        run: echo "SNYK_TOKEN secret not set — add it to enable Snyk scanning (org syntheros). Skipping Snyk steps."

      - name: Checkout
        if: ${{ env.SNYK_TOKEN != '' }}
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Enable corepack + pin pnpm 10.34.1
        if: ${{ env.SNYK_TOKEN != '' }}
        run: |
          corepack enable
          corepack prepare pnpm@10.34.1 --activate

      - name: Setup Node.js 22
        if: ${{ env.SNYK_TOKEN != '' }}
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      # node_modules makes Snyk SCA most accurate (hoisted flat tree).
      - name: Install dependencies (frozen lockfile)
        if: ${{ env.SNYK_TOKEN != '' }}
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Install Snyk CLI
        if: ${{ env.SNYK_TOKEN != '' }}
        run: npm install -g snyk

      # SCA (dependencies). org `syntheros` is the only org with Snyk Code.
      # NOTE: `snyk test` on the full hoisted monorepo root has 400'd before
      # ("tree too large"); if --all-projects fails, scan per workspace with
      # `--file=excalidraw-app/package.json` / `desktop/package.json` instead.
      - name: Snyk SCA (deps)
        if: ${{ env.SNYK_TOKEN != '' }}
        continue-on-error: true
        run: snyk test --org=syntheros --all-projects --severity-threshold=high

      # SAST (source). Snyk Code analyses the repo directly.
      - name: Snyk Code (SAST)
        if: ${{ env.SNYK_TOKEN != '' }}
        continue-on-error: true
        run: snyk code test --org=syntheros --severity-threshold=high

      # Post a snapshot to the Snyk dashboard for ongoing monitoring.
      - name: Snyk monitor
        if: ${{ env.SNYK_TOKEN != '' }}
        continue-on-error: true
        run: snyk monitor --org=syntheros --all-projects
